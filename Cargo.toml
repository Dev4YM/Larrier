[workspace]
resolver = "2"
members = ["crates/core", "crates/formats", "crates/agents", "crates/cli", "app"]
default-members = ["app"]

[workspace.package]
version = "0.1.19"
edition = "2021"
license = "MIT"
repository = "https://github.com/Dev4YM/Larrier"
authors = ["Larrier contributors"]
rust-version = "1.85"

[workspace.dependencies]
larrier-core = { path = "crates/core" }
larrier-formats = { path = "crates/formats" }
larrier-agents = { path = "crates/agents" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
which = "8"
walkdir = "2"
notify = "8"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
open = "5"
rfd = "0.15"
dioxus = { version = "0.7", features = ["desktop"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
