[package]
name = "larrier-app"
description = "Larrier: one desktop app for every coding agent and AI chat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "larrier-desktop"
path = "src/main.rs"

[dependencies]
larrier-core.workspace = true
larrier-formats.workspace = true
larrier-agents.workspace = true
dioxus.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
open.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
similar.workspace = true
arboard = "3"
# Already built for Dioxus: decodes images for Copy Image.
image = "0.25"
portable-pty = "0.9"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify-rust = "4"
base64 = "0.22"
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# Already built for the webview: Windows' spell checker for the right-click menu.
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1"
