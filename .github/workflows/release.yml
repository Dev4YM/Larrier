# Builds Larrier for Windows and publishes it as a GitHub release.
#
# Push a tag that matches the app version (`v0.2.0` for version 0.2.0 in
# Cargo.toml; scripts/release.ps1 makes both), or run it by hand with that
# tag. The release carries `Larrier-<version>-windows-x64.exe` — the app,
# which installs itself — and its `.sha256`, with the version's section of
# CHANGELOG.md as its notes. Versions with a suffix (`-beta.1`) are
# published as previews. Installed copies update from the newest release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0 (must match the version in Cargo.toml)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Already published?
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view $env:TAG --json assets --jq '.assets[].name' 2>$null
          $done = [bool]($names | Where-Object { $_ -like '*-windows-x64.exe' })
          "done=$($done.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($done) { "The release already has its program (published from scripts/release.ps1)." }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.done != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.published.outputs.done != 'true'

      - name: The tag matches the app version
        if: steps.published.outputs.done != 'true'
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'larrier-app').version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match the app version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        if: steps.published.outputs.done != 'true'
        run: cargo build --release --locked -p larrier-app

      - name: Package
        if: steps.published.outputs.done != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "Larrier-$env:VERSION-windows-x64.exe"
          Copy-Item target/release/larrier-desktop.exe "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.sha256" -Value "$hash  $name" -NoNewline -Encoding ascii
          # This version's notes from the changelog.
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^$([regex]::Escape($env:VERSION))\s" } | Select-Object -First 1
          $notes = if ($notes) { ($notes -split "`n", 2)[1].Trim() } else { "Larrier $env:VERSION" }
          Set-Content -Path dist/notes.md -Value $notes -Encoding utf8
          ./target/release/larrier-desktop.exe --version | Out-String

      - name: Publish
        if: steps.published.outputs.done != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -Filter 'Larrier-*' | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $kind = if ($env:VERSION.Contains('-')) { '--prerelease' } else { '--latest' }
            gh release create $env:TAG --title "Larrier $env:VERSION" --notes-file dist/notes.md $kind
          }
          gh release upload $env:TAG $assets --clobber
